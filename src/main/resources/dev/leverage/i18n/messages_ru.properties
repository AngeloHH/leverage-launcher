about.origins1=До смены поколений были MacKey, Akats и Ghost Warrior. Три основателя, заложившие первые блоки Leverage.
about.origins2=MacKey был мозгом и наставником: он написал первый сайт и лаунчер. Akats знал плагины сервера до мелочей. Ghost Warrior приносил моды, бизнес-идеи и ту смесь риска и гениальности, которую Angelo помнит до сих пор.
about.origins3=Angelo учился у всех троих. Первая эпоха оставила не только инструменты, но и подход к созиданию и ответственность, которую потом передавали из рук в руки.
about.relay1=Со вторым поколением пришли новые руки. RK2 находил неожиданное применение любому инструменту, особенно в игровом бою. Fin D' Siglo был душой компании: завидная форма, почти век за плечами по легенде и готовность поддержать любой спор.
about.relay2=Angelo и Weenda начинали как Newbies. Он продолжил дело MacKey, а она превратила неотвеченные заявки в короткий путь к Angelo. ErickBoss принёс спокойствие, музыку и 3D-моделирование. А вот веб-дизайн, по словам Angelo, лучше доверить другим.
about.relay3=Третье поколение объединило дизайн и поддержку Yorky, талант программиста и общительность Uber, а также неожиданный путь Vikingo: от одного из первых заблокированных игроков до одного из лучших сотрудников поддержки. Это было и время непростых перемен в администрации.
about.relay4=Роли менялись, знакомые лица возвращались: MacKey, Fin D' Siglo, Angelo и Weenda оставались частью истории. Затем Ghost Warrior вернулся в администрацию вместе с Panda — будущим юристом, написавшим правила. Skorpion словно умел быть везде, помогая всем без потери качества.
about.relay5=Одни уходили, другие делегировали, третьи меняли роль. Angelo прошёл путь от Newbie до Administrator, а затем Developer. Осталось всё то, что каждый успел построить.
about.today1=Четыре поколения спустя Angelo всё ещё ведёт следующую главу и ищет достойного преемника, чтобы спокойно уйти на отдых. Он учился у трёх основателей и продолжил начатое MacKey.
about.today2=Weenda по-прежнему рядом. Она поддерживала его цели, связывала поддержку с администрацией и всегда была частью истории. Сегодня их связь объясняется ещё проще: она его мама.
about.today3=Следующая передача эстафеты ещё не написана. Leverage остаётся историей людей, которые приходили, учились, строили и оставляли что-то тем, кто придёт после.
