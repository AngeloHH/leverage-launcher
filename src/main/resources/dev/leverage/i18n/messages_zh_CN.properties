about.origins1=在传承与新一代到来之前，是 MacKey、Akats 和 Ghost Warrior。这三位创始人为 Leverage 奠定了最初的基石。
about.origins2=MacKey 是智囊与导师，编写了最初的网站和启动器。Akats 对服务器插件的每个细节都了如指掌。Ghost Warrior 带来了模组、商业创意，以及那份让 Angelo 至今难忘的危险与才华。
about.origins3=Angelo 向这三人学习。那个最初的阶段留下的不只是工具，还有一种创造的方式，以及后来不断传承的责任。
about.relay1=第二代带来了新的力量。RK2 总能为工具找到意想不到的用途，尤其善于把它们变成游戏中的战斗利器。Fin D' Siglo 是团队的灵魂：体格令人羡慕，传说中已近百岁，而且总乐于参与精彩的争论。
about.relay2=Angelo 和 Weenda 都从 Newbie 起步。他延续了 MacKey 的事业；她则把无人回复的工单变成了直达 Angelo 的快车道。ErickBoss 带来了平和、音乐与 3D 建模。不过据 Angelo 说，网页设计还是交给其他人更好。
about.relay3=第三代汇聚了 Yorky 的设计与用户服务、Uber 的编程才华和社交能力，以及 Vikingo 的惊人转变：从最早被封禁的玩家之一，成长为最优秀的客服之一。那也是管理团队经历艰难变化的时期。
about.relay4=职位不断变化，熟悉的面孔也会归来：MacKey、Fin D' Siglo、Angelo 和 Weenda 始终参与其中。后来 Ghost Warrior 与 Panda 一同回到管理团队；Panda 是条款背后那位潜力十足的法律人才。Skorpion 则仿佛能分身，在不降低质量的前提下帮助每一个人。
about.relay5=有人离开，有人交接职责，也有人改变角色。Angelo 从 Newbie 成为 Administrator，之后又成为 Developer。始终留下的，是每个人共同创造的一切。
about.today1=四代人之后，Angelo 仍在带领下一个篇章，寻找值得托付的继任者，以便安心退休。他向三位创始人学习，并延续了 MacKey 开始的事业。
about.today2=Weenda 仍在他身边。她陪伴他的目标，打通客服与管理团队之间的道路，从未缺席这个故事。如今，这份关系还有另一种解释：她是他的母亲。
about.today3=下一次传承尚待书写。Leverage 始终是这样一个故事：人们来到这里，学习、创造，并为后来者留下一些东西。
