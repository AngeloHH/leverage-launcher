about.origins1=Before the handovers and new generations came MacKey, Akats and Ghost Warrior: three founders who laid the first blocks of Leverage.
about.origins2=MacKey was the mastermind and mentor: he programmed the first website and launcher. Akats knew every detail of the server plugins. Ghost Warrior brought mods, business ideas, and that mix of danger and brilliance Angelo still remembers.
about.origins3=Angelo learned from all three. That first era left more than tools: it left a way of building and a responsibility that would pass from hand to hand.
about.relay1=The second generation brought new hands. RK2 found unexpected uses for any tool, especially if it could serve a combat purpose in-game. Fin D' Siglo was the soul of the group: enviably fit, nearly a century old according to legend, and always ready for a good debate.
about.relay2=Angelo and Weenda started as Newbies. He carried on MacKey's work; she turned unanswered tickets into the fast lane to Angelo. ErickBoss brought calm, music and 3D modeling. For web design, better call someone else, as Angelo tells it.
about.relay3=The third generation brought together Yorky's design and user support, Uber's programming talent and people skills, and Vikingo's plot twist: from one of the first banned players to one of the best at helping customers. It was also a time of difficult changes in administration.
about.relay4=Roles shifted and familiar faces returned: MacKey, Fin D' Siglo, Angelo and Weenda remained part of those chapters. Later, Ghost Warrior returned to administration alongside Panda, the budding lawyer behind the terms and conditions. Skorpion seemed to multiply to help everyone without sacrificing quality.
about.relay5=Some people left, others delegated, and others changed roles. Angelo went from Newbie to Administrator and then Developer. What remains is everything each person built.
about.today1=Four generations later, Angelo still leads the next chapter, searching for a worthy successor so he can retire peacefully. He learned from the three founders and continued what MacKey started.
about.today2=Weenda remains by his side. She supported his goals, bridged support and administration, and never left the story. Today their bond has another explanation: she is his mother.
about.today3=The next handover has yet to be written. Leverage remains a story of people who arrived, learned, built, and left something for those who came after.
