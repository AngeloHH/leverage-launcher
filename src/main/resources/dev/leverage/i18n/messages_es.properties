about.origins1=Antes de los relevos y de las nuevas generaciones estuvieron MacKey, Akats y Ghost Warrior. Tres fundadores que pusieron los primeros bloques de Leverage.
about.origins2=MacKey fue el cerebro y el maestro: programó la primera web y el primer launcher. Akats conocía los plugins del servidor hasta el último detalle. Ghost Warrior aportaba mods, ideas de negocio y esa mezcla de peligro y brillantez que Angelo todavía recuerda.
about.origins3=De los tres aprendió Angelo. Aquella primera etapa no dejó solo herramientas: dejó una forma de construir y una responsabilidad que después pasaría de mano en mano.
about.relay1=Con la segunda generación llegaron nuevas manos. RK2 encontraba usos inesperados para cualquier herramienta, sobre todo si podía darle un propósito bélico dentro del juego. Fin D' Siglo era el alma del grupo: físico envidiable, casi un siglo según la leyenda y siempre dispuesto a acompañar una buena polémica.
about.relay2=Angelo y Weenda empezaron como Newbies. Él continuó el mandato de MacKey; ella convirtió los tickets sin respuesta en la vía rápida hasta Angelo. ErickBoss puso la calma, la música y el modelado 3D. Para el diseño web, mejor llamar al resto, como cuenta Angelo.
about.relay3=La tercera generación reunió el diseño y el trato con usuarios de Yorky, el talento para programar y el don de gentes de Uber, y el giro de guion de Vikingo: de estar entre los primeros baneados a ser uno de los mejores atendiendo clientes. También fue una etapa de cambios difíciles en la administración.
about.relay4=Los cargos se movían y algunas caras volvían: MacKey, Fin D' Siglo, Angelo y Weenda siguieron formando parte de esos capítulos. Después, Ghost Warrior volvió a la administración junto a Panda, el abogado en potencia detrás de los términos y condiciones. Skorpion parecía multiplicarse para atender a todos sin bajar la calidad.
about.relay5=Hubo personas que se fueron, otras que delegaron y otras que cambiaron de papel. Angelo pasó de Newbie a Administrator y después Developer. Lo que permanece es todo lo que cada uno dejó construido.
about.today1=Cuatro generaciones después, Angelo sigue al frente de su siguiente capítulo: todavía busca a un sucesor digno para poder retirarse tranquilo. Aprendió de los tres fundadores y continuó lo que MacKey había empezado.
about.today2=Weenda sigue a su lado. Acompañó sus metas, resolvió el camino entre soporte y administración y nunca quedó fuera de la historia. Hoy el vínculo se explica de otra manera: es su madre.
about.today3=El próximo relevo aún no está escrito. Leverage sigue siendo esa historia de gente que llegó, aprendió, construyó y dejó algo para quienes vinieran después.
