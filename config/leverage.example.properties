# Network and storage
server.bind=127.0.0.1
server.port=8080
database.path=data/leverage.db
textures.path=data/textures/sha256
yggdrasil.keys.path=data/yggdrasil

# Agent used by the client and server. Downloads are never accepted unless their SHA-256 matches.
authlib-injector.path=data/tools/authlib-injector-1.2.8.jar
authlib-injector.url=https://authlib-injector.yushi.moe/artifact/56/authlib-injector-1.2.8.jar
authlib-injector.sha256=9c7f4343e6c82034958ffb48c14a2cb0c85928be7283103ce17da00c6d5a7b10

# Accounts
registration.enabled=true
session.ttl.hours=12
device-session.ttl.days=30
game-ticket.ttl.seconds=60
yggdrasil.join.ttl.seconds=30
mods.policy.path=config/mod-policy.json
mods.storage.path=data/mods/sha1
mods.suspension.days=30
launcher.versions.path=config/launcher-versions.json
email.verification.ttl.hours=24
password.recovery.ttl.minutes=30

# During development, messages are printed to the console. Use smtp in production.
mail.mode=console
mail.from=Leverage <noreply@example.com>
mail.action.base-url=leverage://account

# Only used when mail.mode=smtp.
mail.smtp.host=
mail.smtp.port=587
mail.smtp.starttls=true
mail.smtp.ssl=false
mail.smtp.username=
# Set LEVERAGE_SMTP_PASSWORD in the environment; do not store the password here.
